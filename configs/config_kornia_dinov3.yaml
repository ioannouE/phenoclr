data:
  data_dir: "path/to/data/cropped_transparent/"

output:
  out_dir: "path/to/output/RGB_CEFE_embeddings/"

model:
  name: 'simclr_dinov3'
  
  # DinoV3 specific configuration
  dinov3:
    repo: "facebookresearch/dinov3"  # torch.hub repo
    arch: "dinov3_vitl16"  # Architecture: dinov3_vits16, dinov3_vitb16, dinov3_vitl16, dinov3_vit7b16
    weights_path: "path/to/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"  # Path to downloaded weights
    source: "auto"  # auto, github, or local

  optimizer:
    type: "adamw" # adam or adamw or sgd
    lr: 0.0001

  scheduler:
    name: 'CosineAnnealingLR'
    params:
      T_max: 200
      eta_min: 0.001

  criterion:
    name: 'NTXentLoss'
    params:
      temperature: 0.1

seed: 1

dataloader:
  num_workers: 16
  batch_size: 32

train:
  deterministic: true
  accelerator: 'gpu'
  devices: 'auto'
  max_epochs: 200
  log_every_n_steps: 25
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: "train_loss_ssl"
        mode: "min"
        save_top_k: 1
        save_last: true
        filename: "best-{epoch:02d}-{train_loss_ssl:.4f}"

augmentations:
  input_size: 224

  transforms:
    augmentation_strategy: "resize_and_pad"

    random_resize_crop:
      enabled: true
      size: [224, 224]
      scale: [0.05, 1.0]  
      p: 1.0
    
    color_jitter:
      enabled: true
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
      p: 0.8
    
    grayscale:
      enabled: false
      p: 0.25
    
    gaussian_blur:
      enabled: false
      sigma_limit: [0.1, 2.0]
      p: 0.5 
    
    vertical_flip:
      enabled: true
      p: 0.5

    horizontal_flip:
      enabled: true
      p: 0.5

    rotate:
      enabled: true
      limit: 45
      p: 0.5
    
    gaussian_noise:
      enabled: false
      mean_range: [0, 0]
      std_range: [0.05, 0.1]
      p: 0.2
    
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    
    thin_plate_spline:
      enabled: true
      scale: 0.5
      p: 0.5
    
    random_perspective:
      enabled: true
      distortion_scale: 0.5
      p: 0.25
    
    random_erasing:
      enabled: false 
      scale: [0.02, 0.33]
      p: 0.25
    
    random_sharpness:
      enabled: true 
      sharpness: 0.5
      p: 0.5
    
    random_posterize:
      enabled: true 
      bits: 3
      p: 0.5
